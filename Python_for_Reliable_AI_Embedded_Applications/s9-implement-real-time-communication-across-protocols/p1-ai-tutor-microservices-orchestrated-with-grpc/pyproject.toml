[project]
name = "ai-tutor"
version = "3.0.0"
description = "Personalized AI Tutor API with REST, WebSocket, and gRPC support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "openai>=2.2.0",
    "python-dotenv>=1.1.1",
    "uvicorn>=0.34.0",
    "slowapi>=0.1.9",
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "pytest-cov>=6.0.0",
    "websockets>=14.1",
    "grpcio>=1.68.1",
    "grpcio-tools>=1.68.1",
    "requests>=2.31.0",
]
