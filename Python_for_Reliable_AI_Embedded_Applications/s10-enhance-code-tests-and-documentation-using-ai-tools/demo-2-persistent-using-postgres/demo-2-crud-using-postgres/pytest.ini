[pytest]
# Pytest Configuration File
# This file configures how pytest runs your tests

# Test Discovery
# --------------
# pytest automatically finds files matching these patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output Options
# --------------
# -v: verbose output
# -s: show print statements
# --tb=short: shorter traceback format
addopts = 
    -v
    --tb=short
    --strict-markers

# Test Markers
# ------------
# You can mark tests with custom labels
# Example: @pytest.mark.slow
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    rate_limit: marks tests that test rate limiting

# Console Output
# --------------
console_output_style = progress

# Test Paths
# ----------
testpaths = tests

# Minimum Python Version
# ----------------------
minversion = 8.0

