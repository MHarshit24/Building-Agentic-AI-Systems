# .github/workflows/backend-ci.yml
#
# Pipeline (§20): lint → L1+L2+L3 tests → build Docker image
#   → on push to main: deploy to Render/Railway
#
# Key constraints (§19, §24):
#   - PR-blocking LLM call count = 0 (enforced via LLM_PROVIDER=mock)
#   - L1: pure logic unit tests  (tests/unit/)  — no LLM in these code paths
#   - L2: component tests with MockLLMClient    — still tests/unit/ (mock client injected)
#   - L3: integration tests with VCR cassettes  (tests/integration/) — recorded once, no live calls
#   - L4 (golden eval, real LLM) lives in backend-eval.yml — NOT here

name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.14"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/esri-backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Lint
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — L1 + L2 + L3 Tests (zero real LLM calls — §24)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests — L1 + L2 + L3 (mocked / VCR)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: esri_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Enforces zero real LLM calls in every agent; MockLLMClient is injected
      # automatically when this var is set (§19 L1/L2, §24 SLO).
      LLM_PROVIDER: mock
      ENVIRONMENT: test

      # Database — individual components matching config.py Settings field names.
      # config.py actively pops DATABASE_URL from os.environ; never use it here.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: esri_ci

      # Auth (project .env in production)
      JWT_SECRET_KEY: ci-jwt-secret-not-used-in-prod

      # Redis — optional field (str | None = None), included for completeness
      REDIS_URL: redis://localhost:6379/0

      # Azure OpenAI — required fields, dummy CI-only values.
      # LLM_PROVIDER=mock means no real API call is ever made with these.
      AZURE_OPENAI_ENDPOINT: https://ci-placeholder.openai.azure.com/
      AZURE_OPENAI_API_KEY: ci-placeholder-key
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: text-embedding-3-small
      AZURE_OPENAI_API_VERSION: "2024-02-01"

      # Langfuse — required fields, dummy CI-only values
      LANGFUSE_SECRET_KEY: ci-placeholder-langfuse-secret
      LANGFUSE_PUBLIC_KEY: ci-placeholder-langfuse-public
      LANGFUSE_HOST: https://cloud.langfuse.com

      # Mailtrap SMTP — required fields, dummy CI-only values
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: "2525"
      SMTP_USERNAME: ci-placeholder-smtp-user
      SMTP_PASSWORD: ci-placeholder-smtp-pass
      APPLICATION_EMAIL: app@ci.example.com
      SUPPORT_EMAIL: support@ci.example.com

      # MCP notification server — required field, dummy CI-only value
      MCP_NOTIFICATION_URL: http://localhost:9000/notify

      # VCR cassette directory for L3 replay (§19 L3)
      VCR_CASSETTE_DIR: tests/cassettes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations (CI DB)
        run: alembic upgrade head

      # ── L1: Pure logic unit tests — no LLM in any code path ────────────────
      - name: L1 — Pure logic unit tests
        run: |
          pytest tests/unit/ \
            -m "not integration and not eval" \
            --tb=short \
            -q

      # ── L2: Component tests — MockLLMClient injected via LLM_PROVIDER=mock ─
      # L2 tests live alongside L1 in tests/unit/ but exercise agent state
      # transitions, contract shapes, retry/loop-back counters, and error paths.
      # Marked with pytest marker `component` to allow selective re-runs.
      - name: L2 — Component tests (mocked LLM)
        run: |
          pytest tests/unit/ \
            -m "component or not integration" \
            --tb=short \
            -q

      # ── L3: Integration tests — VCR cassettes, no live LLM calls ───────────
      # Cassettes recorded once from real Azure OpenAI responses; replayed here.
      # Covers realistic token-usage fields and response shapes (§19 L3).
      - name: L3 — Integration tests (VCR cassettes)
        run: |
          pytest tests/integration/ \
            -m "not eval" \
            --tb=short \
            -q

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3 — Build Docker image
  # Runs after tests pass; pushes to GHCR on pushes to main only.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4 — Deploy to Render / Railway (main branch only)
  # Triggered after the image is pushed; uses a deploy hook / CLI.
  # Set RENDER_DEPLOY_HOOK_URL or RAILWAY_TOKEN in repo secrets.
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Render / Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        if: vars.DEPLOY_TARGET == 'render'
        run: |
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            --fail \
            --retry 3

      - name: Deploy via Railway CLI
        if: vars.DEPLOY_TARGET == 'railway'
        run: |
          npm install -g @railway/cli
          railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
