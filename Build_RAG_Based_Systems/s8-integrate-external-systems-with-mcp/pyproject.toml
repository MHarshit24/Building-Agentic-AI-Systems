[project]
name = "product-review-sentiment"
version = "0.1.0"
description = "Product review sentiment analysis API using MCP and Hugging Face models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-index==0.14.10",
    "llama-index-llms-azure-openai",
    "llama-index-tools-mcp",
    "mcp>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "huggingface-hub>=0.20.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main"]
