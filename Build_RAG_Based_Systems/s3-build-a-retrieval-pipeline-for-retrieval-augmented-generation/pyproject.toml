description = "AutoMind Motors Sprint 3 - RAG query pipeline using LCEL and PgVector retriever"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangChain core libraries
    "langchain-core==1.0.1",
    "langchain-openai==1.0.0",
    "langchain-postgres==0.0.16",
    # Database
    "psycopg[binary]==3.2.12",
    # API framework
    "fastapi==0.121.0",
    "uvicorn==0.38.0",
    "pydantic>=2.9.0",
    # Configuration
    "python-dotenv==1.2.1",
    # Testing
    "requests>=2.31.0",
    "pytest>=8.0.0",
]
