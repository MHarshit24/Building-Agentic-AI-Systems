[project]
name = "diet-counselling-assistant"
version = "1.0.0"
description = "RAG-based Personal Diet Counselling Assistant with multi-modal content processing (text, tables, images) using LlamaIndex, Azure OpenAI, and PostgreSQL with PGVector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests==2.32.5",
    "python-dotenv==1.2.1",
    "langfuse==3.9.1",
    "FastAPI==0.121.0",
    "pydantic==2.12.4",
    "uvicorn[standard]==0.38.0",
    "langchain_postgres==0.0.16",
    "psycopg2-binary==2.9.11",
    "starlette>=0.40.0,<0.50.0",
    "pypdf==6.2.0",
    "beautifulsoup4==4.14.2",
    "llama-parse==0.6.83",
    "llama-index-core==0.14.8",
    "llama-index-llms-azure-openai==0.4.2",
    "llama-index-embeddings-azure-openai==0.4.1",
    "llama-index-vector-stores-postgres==0.7.1",
    "pymupdf==1.24.0",
    "python-multipart==0.0.20",
    "openai>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.21.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "httpx==0.25.0",
]

[project.scripts]
diet-counselling-assistant = "main:main"
