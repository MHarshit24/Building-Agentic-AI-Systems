[project]
name = "demo-3-investment-advisor-rag"
version = "0.1.0"
description = "Investment advisor RAG with fusion retrieval (BM25+vector+RRF) and safety guardrails (PII redaction, input blocking)."
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.1.0",
  "fastapi>=0.121.0",
  "pydantic>=2.12.4",
  "uvicorn[standard]>=0.38.0",
  "python-multipart>=0.0.20",

  "pypdf>=6.2.0",

  "llama-index-core>=0.14.8",
  "llama-index-llms-azure-openai>=0.4.2",
  "llama-index-embeddings-azure-openai>=0.4.1",
  "llama-index-retrievers-bm25>=0.6.5",
  "llama-index-vector-stores-postgres>=0.7.1",

  "guardrails-ai>=0.4.0",
  "presidio-analyzer>=2.2.360",
  "presidio-anonymizer>=2.2.360",

  "psycopg2-binary>=2.9.0",
  "pgvector>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.21.0",
  "httpx>=0.25.0",
]
